<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appTitle">Calculadora de timecode</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <main id="tape" class="panel tape">
      <header class="tape-head">
        <h1 data-i18n="tape.title">Cinta</h1>
        <div class="head-controls">
          <label class="fps-pick"><span data-i18n="tape.fps">fps de la cinta</span>
            <select id="tape-fps"></select>
          </label>
          <button id="settings-open" type="button" class="icon-btn" data-i18n-title="settings.button" data-i18n-aria-label="settings.button">⚙</button>
          <button id="help-open" type="button" class="icon-btn help-btn" data-i18n-title="help.button" data-i18n-aria-label="help.button">?</button>
        </div>
      </header>

      <ol id="rows" class="rows" data-i18n-aria-label="tape.rowsLabel"></ol>

      <div class="entry-wrap">
        <input id="entry" class="entry" autocomplete="off" spellcheck="false" inputmode="numeric"
               data-i18n-placeholder="tape.entryPlaceholder"
               data-i18n-aria-label="tape.entryLabel">
        <div id="entry-preview" class="entry-preview tc" aria-live="polite"></div>
      </div>

      <footer class="total">
        <div class="total-label" data-i18n="tape.total">Total</div>
        <div id="total-tc" class="total-tc tc">00:00:00:00</div>
        <div id="total-sub" class="total-sub tc">0 frames · 0.000 s</div>
        <div class="total-actions">
          <button id="copy" type="button" data-i18n="tape.copy">Copiar</button>
          <button id="clear" type="button" class="ghost" data-i18n="tape.clear">Vaciar cinta</button>
          <span id="toast" class="toast" role="status"></span>
        </div>
      </footer>
    </main>

    <aside id="tools" class="tools"></aside>
  </div>

  <dialog id="settings" class="modal settings" aria-labelledby="settings-title">
    <header class="help-head">
      <h2 id="settings-title" data-i18n="settings.title">Preferencias</h2>
      <button id="settings-close" type="button" class="ghost" data-i18n="settings.close">Cerrar</button>
    </header>
    <div class="settings-body">
      <label class="pref"><span data-i18n="lang.label">Idioma</span>
        <select id="lang"></select>
      </label>
    </div>
  </dialog>

  <dialog id="help" class="modal help" aria-labelledby="help-title">
    <header class="help-head">
      <h2 id="help-title" data-i18n="help.title">Ayuda</h2>
      <button id="help-close" type="button" class="ghost" data-i18n="help.close">Cerrar</button>
    </header>
    <div id="help-body" class="help-body"></div>
  </dialog>

  <script src="src/i18n.js"></script>
  <script src="src/timecode.js"></script>
  <script src="src/tape.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/tools.js"></script>
</body>
</html>
